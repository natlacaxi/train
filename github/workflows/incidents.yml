# Remplace le contenu de .github/workflows/incidents.yml
name: Incidents

on:
  schedule:
    - cron: "*/20 * * * *"    # toutes les 20 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maj-donnees
  cancel-in-progress: false

jobs:
  incidents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Génère incidents.json
        run: python build_incidents.py --horaires horaires-paca.json --out incidents.json
      - name: Enregistre dans le dépôt
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add incidents.json
          if git diff --staged --quiet; then echo "Rien à enregistrer"; exit 0; fi
          git commit -m "Incidents $(date +%R)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
          
