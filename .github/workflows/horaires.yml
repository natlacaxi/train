name: Mise à jour des horaires

on:
  schedule:
    - cron: "0 3 * * *"   # tous les jours vers 3h-4h (heure de Paris)
  workflow_dispatch:       # bouton « Run workflow » depuis la tablette

permissions:
  contents: write

jobs:
  horaires:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Télécharger le GTFS SNCF
        run: |
          curl -fL --retry 3 --retry-delay 5 -A "Mozilla/5.0" \
            -o gtfs.zip \
            "https://eu.ftp.opendatasoft.com/sncf/plandata/Export_OpenData_SNCF_GTFS_NewTripId.zip"
          ls -lh gtfs.zip
      - name: Générer horaires-paca.json
        run: |
          HTML=$(ls index.html carte-ter*.html 2>/dev/null | head -1)
          if [ -z "$HTML" ]; then echo "::error::Ni index.html ni carte-ter.html à la racine du dépôt"; exit 1; fi
          if [ ! -f build_horaires.py ]; then echo "::error::build_horaires.py absent de la racine du dépôt"; exit 1; fi
          python3 build_horaires.py --gtfs gtfs.zip --html "$HTML" --out horaires-paca.json
      - name: Publier le fichier
        run: |
          git config user.name "horaires-bot"
          git config user.email "horaires-bot@users.noreply.github.com"
          git add horaires-paca.json
          git diff --staged --quiet || git commit -m "Horaires du $(date +%F)"
          git push
